<header class="top" id="top">
  <div class="top__inner">
    <div class="top__left">
      <a href="./" class="top__home" aria-label="홈">
        <img class="top__icon top__icon--home" src="/src/assets/images/guide/icon-home.svg" alt="" width="16" height="16">
      </a>
      <img class="top__icon top__icon--chevron" src="/src/assets/images/guide/icon-chevron.svg" alt="" width="8" height="8" aria-hidden="true">
      <h1 class="top__title">{{topTitle}}</h1>
    </div>
    <div class="top__right">
      <span class="user-select-badge">일반사용자</span>
      <button type="button" class="top__voice" aria-label="음성 안내">
        <img class="top__icon top__icon--voice" src="/src/assets/images/guide/icon-voice-top.svg" alt="" width="20" height="20">
      </button>
      <div class="lang-menu" id="langMenu">
        <button type="button" class="top__lang" id="langToggle" aria-label="언어 설정" aria-expanded="false" aria-haspopup="true">
          <img class="top__icon top__icon--lang" src="/src/assets/images/guide/icon-lang.svg" alt="" width="20" height="20">
        </button>
        <div class="lang-menu__dropdown" id="langDropdown" hidden>
          <button type="button" class="lang-menu__item is-active" data-lang="kor">
            <img src="/src/assets/images/user-select/flag-kr.svg" alt="" width="18" height="12" />
            <span>한국어</span>
          </button>
          <button type="button" class="lang-menu__item" data-lang="eng">
            <img src="/src/assets/images/user-select/flag-us.svg" alt="" width="18" height="12" />
            <span>ENGLISH</span>
          </button>
          <button type="button" class="lang-menu__item" data-lang="chn">
            <img src="/src/assets/images/user-select/flag-cn.svg" alt="" width="18" height="12" />
            <span>中文</span>
          </button>
          <button type="button" class="lang-menu__item" data-lang="jpn">
            <img src="/src/assets/images/user-select/flag-jp.svg" alt="" width="18" height="12" />
            <span>日本語</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
