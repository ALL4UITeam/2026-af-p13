<header class="top" id="top">
  <div class="top__inner">
    <div class="top__left">
      <a href="./" class="top__home" aria-label="홈"></a>
      <span class="top__chevron" aria-hidden="true"></span>
      <h1 class="top__title">{{topTitle}}</h1>
    </div>
    <div class="top__right">
      <button type="button" class="user-select-badge" data-user-select-open aria-haspopup="dialog">일반사용자</button>
      <button type="button" class="top__voice" aria-label="음성 안내"></button>
      <div class="lang-menu" id="langMenu">
        <button type="button" class="top__lang" id="langToggle" aria-label="언어 설정" aria-expanded="false" aria-haspopup="true"></button>
        <div class="lang-menu__dropdown" id="langDropdown" hidden>
          <button type="button" class="lang-menu__item is-active" data-lang="kor">
            <span>한국어</span>
          </button>
          <button type="button" class="lang-menu__item" data-lang="eng">
            <span>ENGLISH</span>
          </button>
          <button type="button" class="lang-menu__item" data-lang="chn">
            <span>中文</span>
          </button>
          <button type="button" class="lang-menu__item" data-lang="jpn">
            <span>日本語</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
