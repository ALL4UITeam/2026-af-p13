<header class="card-course-detail">
  <div class="card-course-detail__thumb">
    <img class="card-course-detail__thumb-img" src="./src/assets/images/explore/hero-gyeongbokgung.jpg" alt="" />
    <div class="card-course-detail__overlay">
      <div class="card-course-detail__toolbar">
        <a href="./tour.html" class="btn-prev" aria-label="뒤로가기">
          <img src="./src/assets/images/explore/icon-page-prev.svg" alt="">
        </a>
        <div class="card-course-detail__actions">
          <button type="button" class="card-course-detail__action" aria-label="음성 안내">
            <img src="./src/assets/images/guide/icon-voice-top.svg" alt=""/>
          </button>
        </div>
      </div>
      <div class="card-course-detail__title-wrap">
        <h1 class="card-course-detail__title">조선의 심장 - 경복궁</h1>
        <p class="card-course-detail__subtitle">주요 전각을 따라 걷는 관람 여정</p>
      </div>
    </div>
  </div>
  <div class="info-bx info-bx--course">
    <span class="info-bx__meta">
      <img src="./src/assets/images/tour/icon-walk.svg" alt="" width="16" height="16" />
      상시 관람
    </span>
    <span class="info-bx__meta">
      <img src="./src/assets/images/tour/icon-palace.svg" alt="" width="16" height="13" />
      주요 지점 6곳
    </span>
    <span class="course-recommend-badge">추천코스 제공</span>
  </div>
</header>
