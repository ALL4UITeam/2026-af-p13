{{#> layout-app}}
<section class="tour" data-page="04-tour">
  <div class="tour__contents">
    {{> components/tour-filter-chips}}
    <p class="tour__count">5개 유적지</p>
    <div class="tour__list">
      {{> components/tour-card}}
      {{> components/tour-card alt=true}}
    </div>
    <aside class="tour-ai-banner">
      <div class="tour-ai-banner__head">
        <strong>나만의 맞춤 투어 만들기</strong>
        <p>AI가 관심사와 일정에 맞는 최적의 투어를 설계해 드립니다.</p>
      </div>
      <button type="button" class="tour-ai-banner__btn">
        AI 투어 설계 시작
        <span class="icon-slot icon-slot--16" aria-hidden="true"></span>
      </button>
    </aside>
  </div>
</section>
{{/layout-app}}
