<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI 국가유산 해설사 - 지도" />
  <title>지도 | 국가 유산 AI 가이드</title>
  <script type="module" crossorigin src="./assets/modulepreload-polyfill.js"></script>
  <script type="module" crossorigin src="./assets/main.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main.css">
</head>
<body class="layout-app layout-app--map">
  
  
  
  <header class="user-select-header" id="userSelectHeader">
  <div class="user-select-header__brand">
    <a href="">
      <picture>
        <source srcset="./assets/images/emblem.svg" media="(min-width: 768px)">
        <img src="./assets/images/emblem-mobile.svg" alt="" width="29" height="28" />
      </picture>
    </a>
  </div>
  <div class="user-select-header__actions">
    <span class="user-select-badge user-select-badge--wide">일반사용자</span>
    <button type="button" class="user-select-header__voice" id="voiceTriggerDesktop" aria-label="음성 안내">
      <span>음성안내</span>
    </button>
    <div class="lang-menu lang-menu--header" id="langMenuHeader">
      <button type="button" class="user-select-header__lang" id="langToggleDesktop" aria-label="언어 설정" aria-expanded="false" aria-haspopup="true" data-lang="kor">
        <span class="user-select-header__lang-flag" aria-hidden="true"></span>
        <span class="user-select-header__lang-label">한국어</span>
      </button>
      <div class="lang-menu__dropdown lang-menu__dropdown--header" id="langDropdownDesktop" hidden>
        <button type="button" class="lang-menu__item is-active" data-lang="kor">
          <span>한국어</span>
        </button>
        <button type="button" class="lang-menu__item" data-lang="eng">
          <span>ENGLISH</span>
        </button>
        <button type="button" class="lang-menu__item" data-lang="chn">
          <span>中文</span>
        </button>
        <button type="button" class="lang-menu__item" data-lang="jpn">
          <span>日本語</span>
        </button>
      </div>
    </div>
  </div>
</header>

  <header class="top" id="top">
    <div class="top__inner">
      <div class="top__left">
        <a href="./" class="top__home" aria-label="홈"></a>
        <span class="top__chevron" aria-hidden="true"></span>
        <h1 class="top__title">지도</h1>
      </div>
      <div class="top__right">
        <span class="user-select-badge">일반사용자</span>
        <button type="button" class="top__voice" aria-label="음성 안내"></button>
        <div class="lang-menu" id="langMenu">
          <button type="button" class="top__lang" id="langToggle" aria-label="언어 설정" aria-expanded="false" aria-haspopup="true"></button>
          <div class="lang-menu__dropdown" id="langDropdown" hidden>
            <button type="button" class="lang-menu__item is-active" data-lang="kor">
              <span>한국어</span>
            </button>
            <button type="button" class="lang-menu__item" data-lang="eng">
              <span>ENGLISH</span>
            </button>
            <button type="button" class="lang-menu__item" data-lang="chn">
              <span>中文</span>
            </button>
            <button type="button" class="lang-menu__item" data-lang="jpn">
              <span>日本語</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="main app-main" id="main">
    <section class="map" data-page="05-map">
      <div class="map__stage">
        <div class="map__canvas" aria-label="지도">
          <img
            class="map__photo"
            src="./assets/images/map/map-screenshot.png"
            alt="경복궁 주변 지도"
            width="598"
            height="780"
          />
        </div>
        <div class="map-search" id="mapSearch">
          <button type="button" class="map-search__back" id="mapSearchBack" aria-label="뒤로">
            <img src="./assets/images/map/icon-chevron-left.svg" alt="" width="24" height="24" />
          </button>
          <input
            type="search"
            class="map-search__query"
            id="mapSearchQuery"
            name="q"
            value="경복궁"
            autocomplete="off"
            enterkeyhint="search"
            aria-label="장소 검색"
          />
          <button type="button" class="map-search__clear" id="mapSearchClear" aria-label="검색어 지우기">
            <img src="./assets/images/map/icon-clear.svg" alt="" width="24" height="24" />
          </button>
          <button type="button" class="map-search__submit" aria-label="검색">
            <img src="./assets/images/map/icon-search.svg" alt="" width="20" height="20" />
          </button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
