<button type="button" class="btn-vps">

      <g filter="url(#btn-vps-camera-shadow)">
        <rect x="4" y="4" width="30" height="30" rx="15" fill="#fff"/>
        <rect x="4.75" y="4.75" width="28.5" height="28.5" rx="14.25" stroke="#000" stroke-width="1.5"/>
        
        <!-- 지도 아이콘 -->
        <g transform="translate(-1, 0)">
          <path d="M13 14L18 12L23 14L28 12V24L23 26L18 24L13 26V14Z" fill="#000"/>

        </g>
      </g>
      <defs>
        <filter id="btn-vps-camera-shadow" x="0" y="0" width="38" height="38" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">

          <feBlend mode="normal" in="SourceGraphic" in2="effect1_dropShadow" result="shape"/>
