<header class="card-detail">
  <div class="card-detail__thumb">
    <img class="card-detail__thumb-img" src="/src/assets/images/explore/hero-gyeongbokgung.jpg" alt="" />
    <div class="thumb-slot thumb-slot--hero" aria-hidden="true"></div>
    <div class="card-detail__overlay">
      <div class="card-detail__toolbar">
        <a href="./explore.html" class="btn-prev" aria-label="뒤로가기">
          <img src="/src/assets/images/explore/icon-page-prev.svg" alt="" />
        </a>
        <div class="card-detail__actions">
          <button type="button" class="card-detail__action" aria-label="음성 안내">
            <img src="/src/assets/images/explore/icon-voice-top.svg" alt="" />
          </button>
        </div>
      </div>
      <div class="card-detail__title-wrap">
        <h1 class="card-detail__title">{{#if detailTitle}}{{detailTitle}}{{else}}경복궁{{/if}}</h1>
        <p class="card-detail__subtitle">{{#if detailSubtitle}}{{detailSubtitle}}{{else}}조선의 대표 법궁{{/if}}</p>
      </div>
    </div>
  </div>
  <div class="info-bx">
    <div class="info-bx__row">
      <span>
        <img src="/src/assets/images/explore/icon-location.svg" alt="" width="16" height="16" />
        서울특별시 종로구 사직로 161 경복궁
      </span>
    </div>
  </div>
</header>
