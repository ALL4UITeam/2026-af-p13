<div class="prompt-mobile" id="promptMobile">
  <button type="button" class="prompt-mobile__scroll" aria-label="아래로 스크롤">
    <img src="/src/assets/images/guide/icon-arrow-down.png" alt="" width="30" height="30" />
  </button>
  <div class="prompt-mobile__field">
    <input type="text" class="prompt-mobile__input" placeholder="궁궐에 대해 무엇이든 물어보세요." aria-label="질문 입력" />
    <div class="prompt-mobile__actions">
      <button type="button" class="prompt-mobile__btn" aria-label="음성 입력">
        <img src="/src/assets/images/guide/icon-mic-prompt.png" alt="" width="32" height="32" />
      </button>
      <button type="button" class="prompt-mobile__btn prompt-mobile__btn--send" aria-label="전송">
        <img class="prompt-mobile__send prompt-mobile__send--default" src="/src/assets/images/guide/icon-send.png" alt="" width="32" height="32" />
        <img class="prompt-mobile__send prompt-mobile__send--active" src="/src/assets/images/guide/icon-send-active.png" alt="" width="32" height="32" />
      </button>
    </div>
  </div>
  <p class="prompt-mobile__notice">AI 답변은 참고용이며 실제 정보와 다를 수 있습니다</p>
</div>
