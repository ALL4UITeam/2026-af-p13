<header class="card-course-detail">
  <div class="card-course-detail__thumb">
    <div class="thumb-slot thumb-slot--hero" aria-hidden="true"></div>
    <div class="card-course-detail__overlay">
      <div class="card-course-detail__toolbar">
        <a href="./tour.html" class="btn-prev" aria-label="뒤로가기">
          <span class="icon-slot icon-slot--24 icon-slot--circle icon-slot--white" aria-hidden="true"></span>
        </a>
        <div class="card-course-detail__actions">
          <button type="button" class="card-course-detail__action" aria-label="음성 안내">
            <span class="icon-slot icon-slot--20" aria-hidden="true"></span>
          </button>
          <button type="button" class="card-course-detail__action" aria-label="북마크">
            <span class="icon-slot icon-slot--24 icon-slot--circle" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <div class="card-course-detail__title-wrap">
        <div class="card-course-detail__tags">
          <span class="badge badge--course">40분 코스</span>
          <div class="theme-tags">
            <span class="theme-tag theme-tag--popular">인기</span>
            <span class="theme-tag theme-tag--family">가족</span>
            <span class="theme-tag theme-tag--beginner">입문</span>
          </div>
        </div>
        <h1 class="card-course-detail__title">조선의 심장 - 경복궁&amp;인사동</h1>
        <p class="card-course-detail__subtitle">40분 핵심 코스</p>
      </div>
    </div>
  </div>
  <div class="info-bx info-bx--course">
    <div class="tour-card__rating">
      <span class="icon-slot icon-slot--16" aria-hidden="true"></span>
      <strong>4.9</strong>
      <span>(24,562)</span>
    </div>
    <span class="tour-card__distance"><span class="icon-slot icon-slot--16" aria-hidden="true"></span> 3.2km</span>
    <span class="difficulty-badge">난이도 <em>쉬움</em></span>
  </div>
</header>
