<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI 국가유산 해설사 - 일반사용자" />
  <title>AI 해설사 | 국가 유산 AI 가이드</title>
  <script type="module" crossorigin src="./assets/modulepreload-polyfill.js"></script>
  <script type="module" crossorigin src="./assets/main.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main.css">
</head>
<body class="layout-app layout-app--guide">
  <header class="user-select-header" id="userSelectHeader">
  <div class="user-select-header__brand">
    <a href="">
      <picture>
        <source srcset="./assets/images/emblem.svg" media="(min-width: 768px)">
        <img src="./assets/images/emblem-mobile.svg" alt="" width="29" height="28" />
      </picture>
    </a>
  </div>
  <div class="user-select-header__actions">
    <span class="user-select-badge user-select-badge--wide">일반사용자</span>
    <button type="button" class="user-select-header__voice" id="voiceTriggerDesktop" aria-label="음성 안내">
      <span>음성안내</span>
    </button>
    <div class="lang-menu lang-menu--header" id="langMenuHeader">
      <button type="button" class="user-select-header__lang" id="langToggleDesktop" aria-label="언어 설정" aria-expanded="false" aria-haspopup="true" data-lang="kor">
        <span class="user-select-header__lang-flag" aria-hidden="true"></span>
        <span class="user-select-header__lang-label">한국어</span>
      </button>
      <div class="lang-menu__dropdown lang-menu__dropdown--header" id="langDropdownDesktop" hidden>
        <button type="button" class="lang-menu__item is-active" data-lang="kor">
          <span>한국어</span>
        </button>
        <button type="button" class="lang-menu__item" data-lang="eng">
          <span>ENGLISH</span>
        </button>
        <button type="button" class="lang-menu__item" data-lang="chn">
          <span>中文</span>
        </button>
        <button type="button" class="lang-menu__item" data-lang="jpn">
          <span>日本語</span>
        </button>
      </div>
    </div>
  </div>
</header>

  
  
  
  <header class="top" id="top">
    <div class="top__inner">
      <div class="top__left">
        <a href="./" class="top__home" aria-label="홈"></a>
        <span class="top__chevron" aria-hidden="true"></span>
        <h1 class="top__title">AI 해설사</h1>
      </div>
      <div class="top__right">
        <span class="user-select-badge">일반사용자</span>
        <button type="button" class="top__voice" aria-label="음성 안내"></button>
        <div class="lang-menu" id="langMenu">
          <button type="button" class="top__lang" id="langToggle" aria-label="언어 설정" aria-expanded="false" aria-haspopup="true"></button>
          <div class="lang-menu__dropdown" id="langDropdown" hidden>
            <button type="button" class="lang-menu__item is-active" data-lang="kor">
              <span>한국어</span>
            </button>
            <button type="button" class="lang-menu__item" data-lang="eng">
              <span>ENGLISH</span>
            </button>
            <button type="button" class="lang-menu__item" data-lang="chn">
              <span>中文</span>
            </button>
            <button type="button" class="lang-menu__item" data-lang="jpn">
              <span>日本語</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>
  <main class="main app-main" id="main">
    <section class="guide" data-page="02-ai-guide" id="guidePage">
      <div class="guide__bg" aria-hidden="true"></div>
      <div class="guide__contents">
        <button type="button" class="btn-vps">
          <img src="./assets/images/guide/btn-vps.png" alt="현재 위치 촬영 VPS" />
        </button>
    
        <div class="guide__chat" id="chatArea">
          <article class="text-bx-mobile text-bx-mobile--ai">
            <div class="text-bx-mobile__head">
              <div class="text-bx-mobile__avatar text-bx-mobile__avatar--ai" aria-hidden="true"></div>
              <div class="text-bx-mobile__meta">
                <time class="text-bx-mobile__time" datetime="14:41">오후 02:41</time>
                <div class="text-bx-mobile__actions">
                  <button type="button" class="text-bx-mobile__action text-bx-mobile__action--speaker" aria-label="음성 재생"></button>
                  <button type="button" class="text-bx-mobile__action text-bx-mobile__action--refresh" aria-label="새로고침"></button>
                </div>
              </div>
            </div>
            <div class="text-bx-mobile__bubble">
              <p>안녕하세요! 저는 조선왕조 국가유산 전문 AI 해설사입니다.</p>
              <p>경복궁, 창덕궁, 창경궁, 덕수궁, 종묘 등 서울의 주요 유적지에 대한 역사, 문화, 관람 정보를 안내 해 드립니다.</p>
              <p>아래 추천 질문을 선택하거나 직접 질문을 입력해 보세요!</p>
            </div>
            
          </article>  
        </div>
    
        <div class="recommend-chips" id="guideChips">
          <div class="recommend-chips__head">
            <img class="recommend-chips__icon" src="./assets/images/guide/icon-message.svg" alt="" width="24" height="24" />
            <span class="recommend-chips__title">추천질문</span>
          </div>
          <div class="recommend-chips__list">
            <button type="button" class="m-chip m-chip--active" data-mode="text" data-question="경복궁에 대한 정보를 자세하게 알려줘"><span class="m-chip__emoji">📋</span> 경복궁에 대한 정보를 자세하게 알려줘</button>
            <button type="button" class="m-chip" data-mode="image" data-question="경복궁을 설명해줘. 이미지도 같이 첨부해줘."><span class="m-chip__emoji">🖼️</span> 경복궁을 설명해줘. 이미지도 같이 첨부해줘.</button>
            <button type="button" class="m-chip" data-mode="map" data-question="경복궁 근정전 지도를 보여줘"><span class="m-chip__emoji">🗺️</span> 경복궁 근정전 지도를 보여줘</button>
            <button type="button" class="m-chip" data-mode="text" data-question="경복궁 근처 맛집 추천해줘">경복궁 근처 맛집 추천해줘</button>
            <button type="button" class="m-chip" data-mode="text" data-question="한복 착용 시 혜택이 있나요?"><span class="m-chip__emoji">✨</span> 한복 착용 시 혜택이 있나요?</button>
            <button type="button" class="m-chip" data-mode="text" data-question="궁궐 관람 시 주의사항은?"><span class="m-chip__emoji">✨</span> 궁궐 관람 시 주의사항은?</button>
          </div>
        </div>
      </div>
    
      <div class="prompt-mobile" id="promptMobile">
        <button type="button" class="prompt-mobile__scroll" aria-label="아래로 스크롤"></button>
        <div class="prompt-mobile__field">
          <input type="text" class="prompt-mobile__input" placeholder="궁궐에 대해 무엇이든 물어보세요." aria-label="질문 입력" />
          <div class="prompt-mobile__actions">
            <button type="button" class="prompt-mobile__btn prompt-mobile__btn--mic" aria-label="음성 입력"></button>
            <button type="button" class="prompt-mobile__btn prompt-mobile__btn--send" aria-label="전송"></button>
          </div>
        </div>
        <p class="prompt-mobile__notice">AI 답변은 참고용이며 실제 정보와 다를 수 있습니다</p>
      </div> 
    </section>
  </main>
</body>
</html>
