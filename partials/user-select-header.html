<header class="user-select-header" id="userSelectHeader">
  <div class="user-select-header__brand">
    <img class="user-select-header__emblem" src="/src/assets/images/user-select/emblem.svg" alt="" width="29" height="28" />
    <div class="user-select-header__titles">
      <p class="user-select-header__title">AI 국가유산 해설사</p>
      <p class="user-select-header__subtitle">조선왕조 국가유산 전문 AI</p>
    </div>
  </div>
  <div class="user-select-header__actions">
    <span class="user-select-badge user-select-badge--wide">일반사용자</span>
    <button type="button" class="user-select-header__voice" id="voiceTriggerDesktop" aria-label="음성 안내">
      <img src="/src/assets/images/user-select/icon-voice.svg" alt="" width="20" height="20" />
      <span>음성안내</span>
    </button>
    <div class="lang-menu lang-menu--header" id="langMenuHeader">
      <button type="button" class="user-select-header__lang" id="langToggleDesktop" aria-label="언어 설정" aria-expanded="false" aria-haspopup="true">
        <img class="user-select-header__lang-flag" src="/src/assets/images/user-select/flag-kr.svg" alt="" width="30" height="20" />
        <span class="user-select-header__lang-label">한국어</span>
      </button>
      <div class="lang-menu__dropdown lang-menu__dropdown--header" id="langDropdownDesktop" hidden>
        <button type="button" class="lang-menu__item is-active" data-lang="kor">
          <img src="/src/assets/images/user-select/flag-kr.svg" alt="" width="18" height="12" />
          <span>한국어</span>
        </button>
        <button type="button" class="lang-menu__item" data-lang="eng">
          <img src="/src/assets/images/user-select/flag-us.svg" alt="" width="18" height="12" />
          <span>ENGLISH</span>
        </button>
        <button type="button" class="lang-menu__item" data-lang="chn">
          <img src="/src/assets/images/user-select/flag-cn.svg" alt="" width="18" height="12" />
          <span>中文</span>
        </button>
        <button type="button" class="lang-menu__item" data-lang="jpn">
          <img src="/src/assets/images/user-select/flag-jp.svg" alt="" width="18" height="12" />
          <span>日本語</span>
        </button>
      </div>
    </div>
  </div>
</header>
