<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI 국가유산 해설사 - 경복궁 로드뷰" />
  <title>로드뷰 | 국가 유산 AI 가이드</title>
  <script type="module" crossorigin src="./assets/modulepreload-polyfill.js"></script>
  <script type="module" crossorigin src="./assets/main.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main.css">
</head>
<body class="layout-full">
  <main class="main" id="main">
    <section class="roadview" data-page="11-roadview" aria-label="로드뷰">
      <div class="roadview__pano" aria-hidden="true">
        <img
          class="roadview__pano-img"
          src="./assets/images/explore/hero-gyeongbokgung.jpg"
          alt=""
          width="1600"
          height="900"
        />
      </div>
    
      <div class="roadview__ui">
        <div class="roadview__top">
          <label class="roadview-toggle is-on" id="roadviewPlaceToggle">
            <span class="roadview-toggle__track" aria-hidden="true">
              <span class="roadview-toggle__knob"></span>
            </span>
            <span class="roadview-toggle__text">
              장소 · 방면정보 표기
              <strong class="roadview-toggle__state">ON</strong>
            </span>
            <input type="checkbox" class="roadview-toggle__input" checked aria-label="장소 · 방면정보 표기" />
          </label>
    
          <div class="roadview__top-actions">
            <button type="button" class="roadview-icon-btn" aria-label="설정">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.7"/>
                <path d="M19.4 13.1c.08-.36.1-.73.1-1.1 0-.37-.02-.74-.1-1.1l2-1.56a.5.5 0 0 0 .12-.64l-1.9-3.28a.5.5 0 0 0-.6-.22l-2.36.95a7.2 7.2 0 0 0-1.9-1.1l-.36-2.5A.5.5 0 0 0 14 2h-4a.5.5 0 0 0-.5.42l-.36 2.5c-.68.27-1.32.64-1.9 1.1l-2.36-.95a.5.5 0 0 0-.6.22L2.38 8.57a.5.5 0 0 0 .12.64l2 1.56c-.08.36-.1.73-.1 1.1 0 .37.02.74.1 1.1l-2 1.56a.5.5 0 0 0-.12.64l1.9 3.28c.14.24.42.34.68.24l2.36-.95c.58.46 1.22.83 1.9 1.1l.36 2.5c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.36-2.5c.68-.27 1.32-.64 1.9-1.1l2.36.95c.26.1.54 0 .68-.24l1.9-3.28a.5.5 0 0 0-.12-.64l-2-1.56Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" class="roadview-icon-btn" aria-label="전체화면">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M8 3H4v4M16 3h4v4M8 21H4v-4M16 21h4v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <button type="button" class="roadview-icon-btn" id="roadviewClose" aria-label="닫기">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M2 2l12 12M14 2 2 14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
        </div>
    
        <aside class="roadview__tools" aria-label="로드뷰 도구">
          <button type="button" class="roadview-tool" aria-label="홈">
            <svg class="roadview-tool__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </button>
          <button type="button" class="roadview-tool" aria-label="공유">
            <svg class="roadview-tool__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="18" cy="5" r="2.6" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="6" cy="12" r="2.6" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="18" cy="19" r="2.6" stroke="currentColor" stroke-width="1.8"/>
              <path d="M8.4 10.7 15.6 6.8M8.4 13.3l7.2 4" stroke="currentColor" stroke-width="1.8"/>
            </svg>
          </button>
          <button type="button" class="roadview-tool" aria-label="의견 보내기">
            <svg class="roadview-tool__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4.5 5.5h15A1.5 1.5 0 0 1 21 7v8.5a1.5 1.5 0 0 1-1.5 1.5H11l-4.5 3.2V17H4.5A1.5 1.5 0 0 1 3 15.5V7A1.5 1.5 0 0 1 4.5 5.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
          </button>
    
          <div class="roadview-zoom" role="group" aria-label="확대/축소">
            <button type="button" class="roadview-zoom__btn" aria-label="확대">+</button>
            <button type="button" class="roadview-zoom__btn" aria-label="축소">−</button>
          </div>
        </aside>
    
        <div class="roadview__bottom">
          <div class="roadview-minimap">
            <img
              class="roadview-minimap__img"
              src="./assets/images/map/map-screenshot.png"
              alt="현재 위치 미니맵"
              width="220"
              height="220"
            />
            <div class="roadview-minimap__marker" aria-hidden="true">
              <span class="roadview-minimap__fov"></span>
              <span class="roadview-minimap__dot"></span>
            </div>
            <div class="roadview-minimap__controls">
              <button type="button" class="roadview-minimap__zoom" aria-label="미니맵 확대">+</button>
              <button type="button" class="roadview-minimap__zoom" aria-label="미니맵 축소">−</button>
            </div>
            <button type="button" class="roadview-minimap__expand" aria-label="미니맵 확대 보기"></button>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
