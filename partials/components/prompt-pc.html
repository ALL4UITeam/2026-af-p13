<div class="prompt-pc" id="promptPc">
  <button type="button" class="prompt-pc__scroll" aria-label="아래로 스크롤">
    <img src="/src/assets/images/guide/icon-arrow-down.png" alt="" width="46" height="46" />
  </button>
  <div class="prompt-pc__field">
    <input type="text" class="prompt-pc__input" placeholder="궁궐에 대해 무엇이든 물어보세요." aria-label="질문 입력" />
    <div class="prompt-pc__actions">
      <button type="button" class="prompt-pc__btn prompt-pc__btn--mic" aria-label="음성 입력">
        <img src="/src/assets/images/guide/icon-mic-prompt.png" alt="" width="40" height="40" />
      </button>
      <button type="button" class="prompt-pc__btn prompt-pc__btn--send" aria-label="전송">
        <span class="prompt-pc__send-icon prompt-pc__send-icon--default">
          <img src="/src/assets/images/guide/icon-send.png" alt="" width="20" height="20" />
        </span>
        <span class="prompt-pc__send-icon prompt-pc__send-icon--active">
          <img src="/src/assets/images/guide/icon-send-active.png" alt="" width="20" height="20" />
        </span>
      </button>
    </div>
  </div>
  <p class="prompt-pc__notice">AI 답변은 참고용이며 실제 정보와 다를 수 있습니다</p>
</div>
